<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mr. Shu Physics Lab</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: #f5f7fa;
            color: #2c3e50;
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        /* Two-column layout */
        .columns {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: center;
            align-items: flex-start;
            max-width: 1100px;
            margin: 0 auto;
        }
        .panel {
            /* flex-basis 360px = ideal width; can shrink down to min-width 280px.
               When the row can't fit two panels side by side, the second one
               automatically wraps onto a new line and they stack vertically. */
            flex: 1 1 360px;
            min-width: 280px;
            max-width: 520px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            padding: 28px 28px 24px;
            box-sizing: border-box;
        }
        .panel h2 {
            margin: 0 0 20px 0;
            text-align: center;
        }

        /* Left panel: PPT list (one row per file) */
        .ppt-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .ppt-list li + li {
            margin-top: 8px;
        }
        .ppt-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 8px;
            background: #f8fafc;
            text-decoration: none;
            color: #2c3e50;
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .ppt-row:hover {
            background: #fdecdc;
            transform: translateX(2px);
        }
        .ppt-row .ppt-icon {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }
        .ppt-row .filename {
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }
        .ppt-row .download-arrow {
            margin-left: auto;
            color: #d35400;
            font-size: 13px;
            flex-shrink: 0;
        }

        /* Resources panel: same row layout as PPT, different accent color */
        .resource-row:hover {
            background: #e6f4ec !important;
        }
        .resource-row .download-arrow {
            color: #16a085 !important;
        }

        /* Right panel: Ask a Question */
        .ask-panel {
            text-align: center;
        }
        .ask-panel p {
            color: #6b7c8a;
            margin: 0 0 24px 0;
        }
        .ask-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            background: #2980b9;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 999px;
            box-shadow: 0 2px 6px rgba(41, 128, 185, 0.3);
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }
        .ask-button:hover {
            background: #1f6391;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(41, 128, 185, 0.35);
        }
        .ask-button svg {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <h1>Welcome to Mr. Shu Physics Lab</h1>

    <div class="columns">
        <!-- Left panel: Lecture Slides list -->
        <section class="panel">
            <h2>Lecture Slides</h2>
            <ul class="ppt-list">
                <li>
                    <a class="ppt-row" href="ppt/第1课时　电容器及电容.pptx" download>
                        <svg class="ppt-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M14 4 H40 L54 18 V56 a4 4 0 0 1 -4 4 H14 a4 4 0 0 1 -4 -4 V8 a4 4 0 0 1 4 -4 z"
                                  fill="#ffffff" stroke="#d35400" stroke-width="2"/>
                            <path d="M40 4 V18 H54" fill="none" stroke="#d35400" stroke-width="2"/>
                            <rect x="16" y="34" width="32" height="18" rx="2" fill="#d35400"/>
                            <text x="32" y="47" text-anchor="middle" font-family="Arial, sans-serif"
                                  font-size="10" font-weight="bold" fill="#ffffff">PPT</text>
                        </svg>
                        <span class="filename">第1课时　电容器及电容.pptx</span>
                        <span class="download-arrow">↓</span>
                    </a>
                </li>
                <li>
                    <a class="ppt-row" href="ppt/电容器的电容.pptx" download>
                        <svg class="ppt-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M14 4 H40 L54 18 V56 a4 4 0 0 1 -4 4 H14 a4 4 0 0 1 -4 -4 V8 a4 4 0 0 1 4 -4 z"
                                  fill="#ffffff" stroke="#d35400" stroke-width="2"/>
                            <path d="M40 4 V18 H54" fill="none" stroke="#d35400" stroke-width="2"/>
                            <rect x="16" y="34" width="32" height="18" rx="2" fill="#d35400"/>
                            <text x="32" y="47" text-anchor="middle" font-family="Arial, sans-serif"
                                  font-size="10" font-weight="bold" fill="#ffffff">PPT</text>
                        </svg>
                        <span class="filename">电容器的电容.pptx</span>
                        <span class="download-arrow">↓</span>
                    </a>
                </li>
            </ul>
        </section>

        <!-- Middle panel: Resources list -->
        <section class="panel">
            <h2>Resources</h2>
            <ul class="ppt-list">
                <!-- No resource files yet. To add one, drop the file into the
                     resources/ folder and copy a <li>…</li> block below, updating
                     the href and the filename text. Example:

                <li>
                    <a class="ppt-row resource-row" href="resources/example.pdf" download>
                        <svg class="ppt-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M14 4 H40 L54 18 V56 a4 4 0 0 1 -4 4 H14 a4 4 0 0 1 -4 -4 V8 a4 4 0 0 1 4 -4 z"
                                  fill="#ffffff" stroke="#16a085" stroke-width="2"/>
                            <path d="M40 4 V18 H54" fill="none" stroke="#16a085" stroke-width="2"/>
                            <line x1="18" y1="30" x2="46" y2="30" stroke="#16a085" stroke-width="2" stroke-linecap="round"/>
                            <line x1="18" y1="38" x2="46" y2="38" stroke="#16a085" stroke-width="2" stroke-linecap="round"/>
                            <line x1="18" y1="46" x2="36" y2="46" stroke="#16a085" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <span class="filename">example.pdf</span>
                        <span class="download-arrow">↓</span>
                    </a>
                </li>
                -->
                <li style="color:#90a4b3; text-align:center; padding:20px 12px; font-size:14px;">
                    No resources yet. Drop files into the <code>resources/</code> folder.
                </li>
            </ul>
        </section>

        <!-- Right panel: Ask a Question -->
        <section class="panel ask-panel">
            <h2>Ask a Question</h2>
            <p>Have a physics question? Click the button below to submit it through our form.</p>
            <a class="ask-button" href="https://forms.microsoft.com/r/Lg4N3RAWZR" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-1.5 2-2.5 2.8-.5.4-.5 1-.5 1.7M12 17h.01"
                          stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="12" cy="12" r="9.5" stroke="#ffffff" stroke-width="2"/>
                </svg>
                Ask a Question
            </a>
        </section>
    </div>
</body>
</html>
