<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mr. Shu Physics Lab</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: #f5f7fa;
            color: #2c3e50;
        }
        h1 {
            text-align: center;
            margin-bottom: 4px;
        }
        .subtitle {
            text-align: center;
            color: #6b7c8a;
            margin-top: 0;
            margin-bottom: 40px;
        }
        h2 {
            text-align: center;
            margin-bottom: 24px;
        }
        .ppt-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .ppt-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 220px;
            padding: 24px 16px 20px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            text-decoration: none;
            color: inherit;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .ppt-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        }
        .ppt-icon {
            width: 110px;
            height: 110px;
            margin-bottom: 16px;
        }
        .ppt-title {
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            line-height: 1.4;
            word-break: break-word;
        }
        .ppt-hint {
            margin-top: 10px;
            font-size: 12px;
            color: #d35400;
        }
    </style>
</head>
<body>
    <h1>Welcome to Mr. Shu Physics Lab</h1>
    <p class="subtitle">High school physics resources for download.</p>

    <h2>Lecture Slides</h2>

    <div class="ppt-grid">
        <a class="ppt-card" href="ppt/第1课时　电容器及电容.pptx" download>
            <!-- PPT icon (inline SVG, no external assets) -->
            <svg class="ppt-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M14 4 H40 L54 18 V56 a4 4 0 0 1 -4 4 H14 a4 4 0 0 1 -4 -4 V8 a4 4 0 0 1 4 -4 z"
                      fill="#ffffff" stroke="#d35400" stroke-width="2"/>
                <path d="M40 4 V18 H54" fill="none" stroke="#d35400" stroke-width="2"/>
                <rect x="16" y="34" width="32" height="18" rx="2" fill="#d35400"/>
                <text x="32" y="47" text-anchor="middle" font-family="Arial, sans-serif"
                      font-size="10" font-weight="bold" fill="#ffffff">PPT</text>
            </svg>
            <div class="ppt-title">Lesson 1: Capacitors and Capacitance</div>
            <div class="ppt-hint">Click to download</div>
        </a>

        <a class="ppt-card" href="ppt/电容器的电容.pptx" download>
            <svg class="ppt-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M14 4 H40 L54 18 V56 a4 4 0 0 1 -4 4 H14 a4 4 0 0 1 -4 -4 V8 a4 4 0 0 1 4 -4 z"
                      fill="#ffffff" stroke="#d35400" stroke-width="2"/>
                <path d="M40 4 V18 H54" fill="none" stroke="#d35400" stroke-width="2"/>
                <rect x="16" y="34" width="32" height="18" rx="2" fill="#d35400"/>
                <text x="32" y="47" text-anchor="middle" font-family="Arial, sans-serif"
                      font-size="10" font-weight="bold" fill="#ffffff">PPT</text>
            </svg>
            <div class="ppt-title">Capacitance of a Capacitor</div>
            <div class="ppt-hint">Click to download</div>
        </a>
    </div>
</body>
</html>
